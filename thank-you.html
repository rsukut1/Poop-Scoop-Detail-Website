<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Thank You | Poop Scoop Detail Form Received</title>

  <meta name="description" content="Thank you for your inquiry. Poop Scoop Detail will contact you within 24 hours." />

  <style>
    :root {
      --light-green: #dcefd8;
      --mid-green: #9fcb9b;
      --dark-green: #2f5d3b;
      --white: #ffffff;
      --text: #2f5d3b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      opacity: 0;
      animation: pageFadeIn 0.8s ease-out forwards;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--white) 0%, var(--light-green) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    @keyframes pageFadeIn {
      to { opacity: 1; }
    }

    .container {
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(47, 93, 59, 0.12);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 40px rgba(47, 93, 59, 0.08);
      backdrop-filter: blur(4px);
    }

    .logo {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
      animation: logoEnter 1s ease-out 0.2s forwards;
      max-width: 240px;
      width: 100%;
      margin: 0 auto 28px auto;
      display: block;
    }

    @keyframes logoEnter {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      font-size: clamp(2rem, 3.5vw, 3rem);
      font-weight: 700;
      color: var(--dark-green);
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #456b4d;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .note {
      font-size: 0.95rem;
      color: #5f7d66;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .home-link {
      display: inline-block;
      text-decoration: none;
      background: var(--dark-green);
      color: white;
      padding: 12px 22px;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(47, 93, 59, 0.15);
      position: relative;
      overflow: hidden;
    }

    .home-link:hover {
      transform: translateY(-3px);
      box-shadow:
        0 8px 20px rgba(47, 93, 59, 0.25),
        0 0 12px rgba(159, 203, 155, 0.35);
      background: #24492e;
    }

    .home-link::before {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.25),
        transparent
      );
      transform: skewX(-20deg);
    }

    .home-link:hover::before {
      animation: shimmer 0.6s ease;
    }

    @keyframes shimmer {
      100% { left: 125%; }
    }
  </style>
</head>

<body>

<main class="container">

  <img src="assets/PS Detail Fin.png" class="logo" alt="Poop Scoop Detail Logo" />

  <h1>Thank You!</h1>

  <p class="subtitle">
    We’ve received your quote request.
  </p>

  <p class="note">
    Our team will review your information and contact you within 24 hours
    with your custom quote or any follow-up questions.
  </p>

  <a class="home-link" href="index2.html">
    Back to Homepage
  </a>

</main>

</body>
</html>
